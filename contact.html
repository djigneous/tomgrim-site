<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.ico?v=2" sizes="48x48"><link rel="icon" href="favicon.svg?v=2" type="image/svg+xml"><link rel="icon" href="favicon-32.png?v=2" sizes="32x32" type="image/png"><link rel="icon" href="favicon-192.png?v=2" sizes="192x192" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" sizes="180x180"><link rel="stylesheet" href="grimos.css?v=20261025232651">

  <section class="win cwin" aria-labelledby="t-c"><h2 class="wt" id="t-c"><span>─[ mail tom@grimos ]─</span></h2>

      <label>name:<input name="name" autocomplete="name" maxlength="100"></label>

      <input type="hidden" name="_subject" value="Inquiry from GrimOS">

    </form>
  </section></main></div>
<script>try{const t=localStorage.grimTheme;if(t)document.body.className=document.body.className.replace(/theme-\w+/,'theme-'+t);if(localStorage.grimCrt==='0')document.body.classList.add('nocrt');var mc=document.querySelector('meta[name=theme-color]'),bg=getComputedStyle(document.body).getPropertyValue('--bg').trim();if(mc&&bg)mc.content=bg}catch(e){}window.tgTrack=function(k,t){try{var g=window.goatcounter;if(!g||typeof g.count!=='function')return;var s=String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'untitled';g.count({path:k+'/'+s,title:String(t||''),event:true})}catch(e){}};</script>
